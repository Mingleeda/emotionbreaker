name: EmotionBreaker
options:
  bundleIdPrefix: com.hyub
  deploymentTarget:
    iOS: "17.0"
targets:
  EmotionBreaker:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 보내기 전 60초
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchDuri
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        EmotionCoachBaseURL: https://emotionbreaker-web.vercel.app
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: 감정을 말로 털어놓을 때 목소리를 녹음하기 위해 마이크를 사용합니다.
        NSSpeechRecognitionUsageDescription: 말한 내용을 텍스트로 바꿔서 보여주기 위해 음성 인식을 사용합니다.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hyub.emotionbreaker
        DEVELOPMENT_TEAM: S9F62N3WJA
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
